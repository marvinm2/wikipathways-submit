# Local development stack (app + PostgreSQL) — mirrors the production datastore so migrations and
# the Postgres path can be exercised before the cluster. NOT the cluster deployment: on the
# Strato swarm the app runs as a Traefik-routed service (see docs/deployment.md).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wpsubmit
      POSTGRES_PASSWORD: wpsubmit
      POSTGRES_DB: wpsubmit
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wpsubmit"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      WPSUBMIT_DATABASE_URL: postgresql+psycopg://wpsubmit:wpsubmit@db:5432/wpsubmit
      WPSUBMIT_SESSION_SECRET: dev-insecure-change-me
      # Add WPSUBMIT_GITHUB_OAUTH_* / WPSUBMIT_GITHUB_APP_* here to exercise the full flow.
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: {}
