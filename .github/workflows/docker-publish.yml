name: Build and Publish Container Image

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # github.repository_owner is lowercase here (marvinm2); GHCR rejects uppercase tags.
          tags: |
            ghcr.io/${{ github.repository_owner }}/wikipathways-submit:latest
            ghcr.io/${{ github.repository_owner }}/wikipathways-submit:${{ github.sha }}
