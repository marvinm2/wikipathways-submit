name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Lint
        run: ruff check app/ tests/ migrations/env.py
      - name: Test
        run: pytest -q
