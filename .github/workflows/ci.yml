name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # --system installs into the runner's Debian Python, which is externally managed (PEP 668)
      # and refuses. setup-uv has already created .venv and pointed VIRTUAL_ENV at it, so install
      # into that and run the tools out of it.
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check app/ tests/ migrations/env.py
      - name: Test
        run: .venv/bin/pytest -q
