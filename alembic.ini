# Alembic config for the transactional registry (design §4).
# The database URL is NOT set here — env.py reads it from app settings (WPSUBMIT_DATABASE_URL)
# or an `-x db_url=...` override, so migrations follow the same 12-factor config as the app.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Timezone-aware, sortable revision filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
