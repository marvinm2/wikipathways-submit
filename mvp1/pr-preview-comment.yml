# PR preview comment — post the validation summary back onto the PR.
#
# SHIPS TO: wikipathways-database/.github/workflows/pr-preview-comment.yml
#
# The build workflow (pr-preview.yml, trigger: pull_request) runs in the PR/fork context
# with NO secrets and a read-only token, so it cannot comment. This workflow triggers on
# its completion (workflow_run) and therefore runs in the BASE repo context — trusted, with
# a write token — but it only reads the uploaded artifact and posts it. It never checks out
# or executes PR code, which is what makes the split safe.
#
# It upserts a single "sticky" comment (matched by an HTML marker) so re-pushes update in
# place instead of spamming the thread.
#
# HARDENING (from the MVP-1 adversarial review): the artifact is produced in the untrusted
# fork context, so preview/pr-number.txt is treated as UNTRUSTED. Before writing anything we
# resolve that PR from the API and require its head SHA to equal this workflow_run's
# head_sha — so a poisoned artifact cannot redirect the write-token comment onto a different
# (victim) PR or an arbitrary issue. A missing artifact (delete-only/no-op PR) is a no-op.

name: PR preview comment

on:
  workflow_run:
    workflows: ["PR preview"]
    types:
      - completed

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download preview artifact
        id: download
        continue-on-error: true # a no-op/delete-only PR uploads nothing — tolerate it
        uses: actions/download-artifact@v4
        with:
          name: pr-preview
          path: preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post or update sticky comment
        if: steps.download.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- wikipathways-pr-preview -->';

            // comment.md + pr-number.txt come from an artifact built in the UNTRUSTED fork
            // context — do not trust either blindly.
            let body, prNumber;
            try {
              body = fs.readFileSync('preview/comment.md', 'utf8');
              prNumber = parseInt(fs.readFileSync('preview/pr-number.txt', 'utf8').trim(), 10);
            } catch (e) {
              core.info('No comment.md/pr-number.txt in artifact — nothing to post.');
              return;
            }
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.info(`No valid PR number in artifact (${prNumber}) — skipping.`);
              return;
            }

            // CRITICAL: verify the claimed PR actually belongs to the run that produced this
            // artifact. The run's head_sha is trusted (from the workflow_run event); the PR
            // number from the artifact is not. Require them to agree, else refuse — this
            // defeats cross-PR / arbitrary-issue comment spoofing via a poisoned artifact.
            const runHeadSha = context.payload.workflow_run.head_sha;
            const { owner, repo } = context.repo;
            let pr;
            try {
              pr = (await github.rest.pulls.get({ owner, repo, pull_number: prNumber })).data;
            } catch (e) {
              core.setFailed(`Could not fetch PR #${prNumber}: ${e.message}`);
              return;
            }
            if (pr.head.sha !== runHeadSha) {
              core.setFailed(
                `Refusing to comment: PR #${prNumber} head ${pr.head.sha} != run head ${runHeadSha}. ` +
                `Artifact may be spoofed.`
              );
              return;
            }

            if (!body.includes(marker)) body = marker + '\n' + body;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: prNumber, per_page: 100 }
            );
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`Updated sticky comment ${existing.id} on PR #${prNumber}`);
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              core.info(`Created sticky comment on PR #${prNumber}`);
            }
