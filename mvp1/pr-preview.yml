# PR preview — render + validate changed pathways on pull_request.
#
# SHIPS TO: wikipathways-database/.github/workflows/pr-preview.yml
# (MVP-1 of the wikipathways-submit proposal — see that repo's docs/design-proposal.md §4.4)
#
# WHY THIS EXISTS: today the reviewable artifacts (SVG, datanodes/bibliography TSVs,
# validation) are only generated by on_gpml_change.yml AFTER merge to main, so curators
# approve raw XML. This runs the *review subset* of that pipeline on the PR and publishes
# the result as a downloadable artifact — WITHOUT committing derived files or pushing to
# the sister repos (assets / homology / jekyll). It reuses the generator invocations proven
# in scripts/local-run/on-gpml-change_local.sh.
#
# SECURITY MODEL: this workflow runs in the PR's (possibly fork) context, so it has NO
# secrets and a read-only token — even though it executes untrusted GPML through the
# Java/Node converters. It cannot comment on the PR itself. A second workflow,
# pr-preview-comment.yml (trigger: workflow_run), picks up this artifact in the base-repo
# context and posts the sticky comment with pull-requests:write. Never merge these two into
# a single pull_request_target job that checks out PR head — that would run untrusted code
# with a write token.
#
# HARDENING (from the MVP-1 adversarial review): attacker-controlled changed filenames are
# passed to the shell via `env:`, never spliced into a run script via ${{ }} (script
# injection); pre-existing committed derived files are deleted before regeneration so a
# swallowed generator failure can never surface stale tables as a fresh preview; the
# comment body is size-capped; the artifact is always uploaded (even for delete-only PRs).

name: PR preview

on:
  pull_request:
    paths:
      - "pathways/**/*.gpml"

# Read-only. No write access, no secrets reach this job.
permissions:
  contents: read

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-22.04 # pinned: newer images break the puppeteer render (see json-svg job upstream)
    steps:
      - name: Checkout PR (merge ref)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # need base..head to diff changed GPMLs
          submodules: true

      - name: Identify changed GPMLs
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # Added/Copied/Modified/Renamed .gpml under pathways/. Deletions don't render.
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- 'pathways/**/*.gpml' | sort -u)
          echo "Changed GPMLs: ${files[*]:-<none>}"

          # Robust organism extraction (whole-file grep, tolerant of trailing attributes
          # and wrapped <Pathway> tags — unlike a line-anchored sed).
          orgs=()
          for f in "${files[@]}"; do
            [ -e "$f" ] || continue
            o="$(grep -o 'Organism="[^"]*"' "$f" | head -n1 | sed 's/Organism="//; s/"$//')"
            [ -n "$o" ] && orgs+=("$o")
          done
          # Sanitize into a cache-key-safe token (organisms actually touched by this PR).
          orgs_key="$(printf '%s\n' "${orgs[@]:-none}" | sort -u | tr ' ' '_' | tr -cd 'A-Za-z0-9_\n' | paste -sd- -)"
          [ -z "$orgs_key" ] && orgs_key="none"

          {
            echo "files<<__EOF__"
            printf '%s\n' "${files[@]}"
            echo "__EOF__"
            echo "count=${#files[@]}"
            echo "orgs_key=${orgs_key}"
            echo "orgs<<__ORGS__"
            printf '%s\n' "${orgs[@]:-}" | sort -u
            echo "__ORGS__"
          } >> "$GITHUB_OUTPUT"

      - name: Initialize preview dir
        # Always present so the artifact uploads even for delete-only / no-op PRs (the
        # comment workflow then has a pr-number + a body and never errors on a missing artifact).
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p preview
          printf '%s' "$PR_NUMBER" > preview/pr-number.txt
          echo pass > preview/status.txt
          {
            echo "<!-- wikipathways-pr-preview -->"
            echo "## 🧬 WikiPathways PR preview"
            echo
            echo "No renderable GPML changes in this PR."
          } > preview/comment.md

      - name: Setup Java
        if: steps.changed.outputs.count != '0'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Setup Node
        if: steps.changed.outputs.count != '0'
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Setup Python
        if: steps.changed.outputs.count != '0'
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: System deps
        if: steps.changed.outputs.count != '0'
        run: sudo apt-get update && sudo apt-get install -y xmlstarlet jq

      - name: Cache meta-data-action jar
        if: steps.changed.outputs.count != '0'
        uses: actions/cache@v5
        with:
          path: ./meta-data-action-1.1.4-jar-with-dependencies.jar
          key: meta-data-action-1.1.4

      - name: Cache BridgeDb derby files
        id: cacheBridge
        if: steps.changed.outputs.count != '0'
        uses: actions/cache@v5
        with:
          # Keyed on the organism(s) this PR actually touches (known at restore time),
          # so the cache is genuinely per-organism instead of a frozen constant key.
          path: |
            ./*.bridge
          key: bridge-files-${{ steps.changed.outputs.orgs_key }}
          restore-keys: bridge-files-

      - name: Install BridgeDb files (cache miss)
        # Mirrors on_gpml_change.yml's "Install all bridge files" — DOWNLOADS the .bridge derby
        # for the touched organism(s). configGenerator alone only writes gdb.config; without this
        # download meta-data-action fails (NoSuchFileException Hs_Derby_*.bridge) and the render
        # produces no SVG. Only runs on a cache miss.
        if: steps.changed.outputs.count != '0' && steps.cacheBridge.outputs.cache-hit != 'true'
        env:
          ORGS: ${{ steps.changed.outputs.orgs }}
        run: |
          set -uo pipefail
          while IFS= read -r org; do
            [ -z "$org" ] && continue
            echo "::group::BridgeDb $org"
            scripts/meta-data-action/configGenerator.sh "$org" || echo "::warning::configGenerator failed for $org"
            scripts/meta-data-action/installDependencies.sh "$org" || echo "::warning::installDependencies failed for $org"
            echo "::endgroup::"
          done <<< "$ORGS"

      - name: Install meta-data-action
        if: steps.changed.outputs.count != '0'
        run: |
          if [ ! -e ./meta-data-action-1.1.4-jar-with-dependencies.jar ]; then
            wget -q -O meta-data-action-1.1.4-jar-with-dependencies.jar \
              https://github.com/wikipathways/meta-data-action/releases/download/v1.1.4/meta-data-action-1.1.4-jar-with-dependencies.jar
          fi
          chmod 777 meta-data-action-1.1.4-jar-with-dependencies.jar

      - name: Install render deps
        if: steps.changed.outputs.count != '0'
        working-directory: scripts/generate-svgs
        run: npm install

      - name: Install reference deps
        if: steps.changed.outputs.count != '0'
        working-directory: scripts/generate-references
        run: npm install

      # --- Before/after render with PinPath (issue #11) --------------------------------------
      # Renders BOTH the PR-head version (after) and the base-branch version (before) with PinPath
      # so the app's before/after viewer shows a consistent pair. Runs BEFORE "Generate review
      # artifacts" so validation can accept PinPath's WP<id>-after.svg as the "Rendered SVG" —
      # gpmlconverter's WP<id>.svg (rendered in that step) is blocked by upstream HTTP-400s, and a
      # good PinPath render is a genuine render pass, not a FAIL (curator decision, 2026-07-26).
      # Validated on a real runner 2026-07-26 (fork PR #4, WP554): install + render green.
      # Plain render (no data overlay) → no Bioconductor annotation DB needed.
      # Cost note: the first run installs PinPath + deps (minutes); the R-packages cache amortises
      # subsequent runs. If this proves too heavy for every PR, split it into its own workflow.
      # All PinPath steps are continue-on-error: they are a best-effort enhancement. If PinPath
      # can't install or render, the gpmlconverter WP<id>.svg still ships and the run stays green —
      # the preview must never be sunk by the render step.
      - name: Setup R (PinPath)
        if: steps.changed.outputs.count != '0'
        continue-on-error: true
        uses: r-lib/actions/setup-r@v2
        with:
          # PinPath (devel, v0.99.x) requires R >= 4.6.0, so we must track current-release R —
          # an older pin (4.4.2) fails R CMD build with "package 'PinPath' requires R >= 4.6.0".
          # 'release' is R 4.6.x now, whose BiocManager resolves the released Bioc 3.23 (paired
          # with R 4.6 since April 2026), so the earlier "avoid devel Bioc 3.23" concern is moot.
          r-version: "release"
          use-public-rspm: true

      - name: Cache R packages
        if: steps.changed.outputs.count != '0'
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-pinpath-${{ runner.os }}-rrelease-v3

      - name: Install PinPath
        if: steps.changed.outputs.count != '0'
        continue-on-error: true
        env:
          # remotes reads GITHUB_PAT for the GitHub API (fetching DESCRIPTION etc.). Without it
          # the unauthenticated 60-req/hr limit is easily hit → "cannot open URL .../DESCRIPTION".
          # github.token is the workflow's default read-only token (safe; cannot push).
          GITHUB_PAT: ${{ github.token }}
        run: |
          # PinPath is not on the Bioconductor *release* yet — install from GitHub. BiocManager
          # resolves the Bioconductor deps, but its GitHub install path needs `remotes` present.
          Rscript -e 'install.packages(c("remotes","BiocManager"), repos="https://cloud.r-project.org")' \
                  -e 'BiocManager::install("SyNUM-lab/PinPath", ask=FALSE, update=FALSE)' \
                  -e 'library(PinPath); cat("PinPath OK\n")'

      - name: Render before/after with PinPath
        if: steps.changed.outputs.count != '0'
        continue-on-error: true
        env:
          FILES: ${{ steps.changed.outputs.files }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            wpid="$(basename "$f" .gpml)"
            mkdir -p "preview/$wpid"
            # after = the PR head version
            if [ -e "$f" ]; then
              Rscript scripts/render_pinpath.R "$f" "preview/$wpid" "$wpid-after.svg" \
                || echo "::warning::PinPath after-render failed for $wpid"
            fi
            # before = the version currently on the base branch (updates only; new pathways
            # have no base version, so the viewer shows a single "after").
            if git cat-file -e "$BASE_SHA:$f" 2>/dev/null; then
              tmp="$(mktemp --suffix=.gpml)"
              git show "$BASE_SHA:$f" > "$tmp"
              Rscript scripts/render_pinpath.R "$tmp" "preview/$wpid" "$wpid-before.svg" \
                || echo "::warning::PinPath before-render failed for $wpid"
              rm -f "$tmp"
            fi
          done <<< "$FILES"

      - name: Generate review artifacts
        if: steps.changed.outputs.count != '0'
        env:
          # Attacker-controllable filenames reach the shell ONLY as data via env,
          # never spliced into the script text through ${{ }} (script-injection sink).
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          set -uo pipefail

          # Pass 1 — clean, (re)generate metadata, render. Delete any committed derived
          # files first so a swallowed generator failure surfaces as a visible FAIL
          # (missing files) rather than publishing the previous merged version as "fresh".
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ -e "$f" ] || { echo "::warning::$f not in tree — skip"; continue; }
            wpid="$(basename "$f" .gpml)"
            echo "::group::Generate $wpid"

            rm -f "pathways/$wpid/$wpid-info.json" "pathways/$wpid/$wpid-datanodes.tsv" \
                  "pathways/$wpid/$wpid-refs.tsv" "pathways/$wpid/$wpid-bibliography.tsv"

            # empty <bp:ID> breaks meta-data-action (Citation must have xref/url).
            sed -i 's/><\/bp:ID>/>NA<\/bp:ID>/' "$f" || true

            org="$(grep -o 'Organism="[^"]*"' "$f" | head -n1 | sed 's/Organism="//; s/"$//')"
            echo "organism: ${org:-<none>}"
            scripts/meta-data-action/configGenerator.sh "$org" || echo "::warning::configGenerator failed for $org"
            java -jar meta-data-action-1.1.4-jar-with-dependencies.jar \
              wikipathways/wikipathways-database "$f" "$(date --utc +%F)" gdb.config "$org" \
              || echo "::warning::meta-data-action failed for $wpid"

            mkdir -p "preview/$wpid"
            (cd scripts/generate-svgs && ./gpmlconverter --id "$wpid" \
              -i "../../$f" -o "../../preview/$wpid/$wpid.svg") || echo "::warning::render failed for $wpid"
            echo "::endgroup::"
          done <<< "$FILES"

          # generate-references is whole-repo scoped and processes every changed pathway in
          # ONE pass — run it once, not once per file (quadratic otherwise).
          (cd scripts/generate-references && node index.js) || echo "::warning::generate-references failed"

          # Pass 2 — validate, collect artifacts, build the comment.
          overall=pass
          full=""       # per-pathway validation tables
          rollup=""     # one compact line per pathway (fallback when the full body is too big)
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            wpid="$(basename "$f" .gpml)"

            # Try the gpmlconverter render first, then fall back to PinPath's -after.svg
            # (rendered in the step above). gpmlconverter is currently blocked by upstream
            # HTTP-400s, so a good PinPath render is a genuine "Rendered SVG" pass, not a FAIL.
            python scripts/validate_pathway.py "$wpid" \
              --pathways-dir pathways \
              --rendered "preview/$wpid/$wpid.svg" \
              --rendered "preview/$wpid/$wpid-after.svg" \
              --out "preview/$wpid/validation.md" \
              --status-file "preview/$wpid/status.txt"

            st="$(cat "preview/$wpid/status.txt" 2>/dev/null || echo pass)"
            case "$st" in
              fail) overall=fail ;;
              warn) [ "$overall" = pass ] && overall=warn ;;
            esac
            case "$st" in fail) ic="❌";; warn) ic="⚠️";; *) ic="✅";; esac

            for ext in -datanodes.tsv -bibliography.tsv -refs.tsv -info.json; do
              [ -e "pathways/$wpid/$wpid$ext" ] && cp "pathways/$wpid/$wpid$ext" "preview/$wpid/"
            done
            full+="$(cat "preview/$wpid/validation.md")"$'\n\n'
            rollup+="- $ic \`$wpid\` — ${st^^}"$'\n'
          done <<< "$FILES"

          echo "$overall" > preview/status.txt

          header="<!-- wikipathways-pr-preview -->
          ## 🧬 WikiPathways PR preview

          Generated review artifacts for the changed pathway(s). Full render + tables are in the **pr-preview** artifact on this run.
          "
          printf '%s\n%s' "$header" "$full" > preview/comment.md

          # GitHub rejects comment bodies over 65536 chars — fall back to the compact
          # roll-up on big batch PRs so the comment still posts.
          if [ "$(wc -c < preview/comment.md)" -gt 60000 ]; then
            printf '%s\n%s\n_Per-pathway tables omitted (large PR) — see the **pr-preview** artifact._\n' \
              "$header" "$rollup" > preview/comment.md
          fi

          cat preview/comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preview artifact
        # Always — even on a no-op/delete-only PR, so the comment workflow never fails on a
        # missing artifact.
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview
          path: preview/
          retention-days: 14
